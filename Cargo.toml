[package]
name = "ghostbin"
version = "1.0.0"
edition = "2021"
authors = ["synth <synthalorian@gmail.com>"]
description = "AI-assisted reverse engineering tool with local LLMs"
license = "Apache-2.0"
repository = "https://github.com/synthalorian/ghostbin"

[lib]
name = "ghostbin"
path = "src/lib.rs"

[[bin]]
name = "ghostbin"
path = "src/main.rs"

[dependencies]
# Core
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Binary analysis
goblin = "0.8"          # ELF/Mach-O/PE parsing
capstone = "0.12"       # Disassembly

# Local LLM client (optional at runtime; localhost only)
reqwest = { version = "0.11", features = ["json"] }

# Graph data structures
petgraph = "0.6"


[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.4", features = ["util"] }
